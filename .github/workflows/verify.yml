name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run demo
      - run: npm run site
      - uses: actions/upload-artifact@v4
        with:
          name: afterflag-evidence
          path: artifacts/afterflag-report.json
