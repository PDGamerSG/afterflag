x-flagsmith-env: &flagsmith-env
  DATABASE_URL: postgresql://postgres:afterflag@postgres:5432/flagsmith
  USE_POSTGRES_FOR_ANALYTICS: 'true'
  ENVIRONMENT: production
  DJANGO_ALLOWED_HOSTS: '*'
  FLAGSMITH_DOMAIN: localhost:18000
  DJANGO_SECRET_KEY: afterflag-local-secret
  WAREHOUSE_CREDENTIALS_SECRET: afterflag-local-secret
  TASK_RUN_METHOD: TASK_PROCESSOR
  PROMETHEUS_ENABLED: 'true'
  EXPERIMENTATION_ENABLED: 'true'
  CACHE_FLAGS_SECONDS: '0'
  GET_FLAGS_ENDPOINT_CACHE_SECONDS: '0'
  ENVIRONMENT_CACHE_SECONDS: '0'

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: afterflag
      POSTGRES_DB: flagsmith
    volumes:
      - afterflag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d flagsmith -U postgres']
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 20s

  migrate-db:
    image: docker.flagsmith.com/flagsmith/flagsmith:2.295.2@sha256:48905c664152d8ae2c843ec9cee72ff197e7caff6e91b959bb851a235915ea35
    command: [migrate]
    environment:
      <<: *flagsmith-env
    depends_on:
      postgres:
        condition: service_healthy

  flagsmith:
    image: docker.flagsmith.com/flagsmith/flagsmith:2.295.2@sha256:48905c664152d8ae2c843ec9cee72ff197e7caff6e91b959bb851a235915ea35
    command: [serve]
    environment:
      <<: *flagsmith-env
    ports:
      - 127.0.0.1:18000:8000
    depends_on:
      migrate-db:
        condition: service_completed_successfully

  flagsmith-task-processor:
    image: docker.flagsmith.com/flagsmith/flagsmith:2.295.2@sha256:48905c664152d8ae2c843ec9cee72ff197e7caff6e91b959bb851a235915ea35
    command: [run-task-processor]
    environment:
      <<: *flagsmith-env
    depends_on:
      migrate-db:
        condition: service_completed_successfully

volumes:
  afterflag_pgdata:
